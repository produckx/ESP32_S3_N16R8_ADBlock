[platformio]
default_envs = esp32s3

[env]
; espressif32 6.x: platform còn published đầy đủ toolchain cho ESP32-S3 (5.1.0
; tham chiếu toolchain-riscv32 8.4.0+2021r2-patch3 đã bị gỡ khỏi registry).
platform = espressif32@6.9.0
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

; ESP32-S3-WROOM-1 N16R8: 16 MB QIO flash + 8 MB OPI (octal) PSRAM.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; WS2812 RGB LED. N16R8 devkit thường GPIO48; đổi -DRGB_LED_PIN=38 nếu board dùng 38.
; USB_MODE/CDC_ON_BOOT: Serial đi ra cổng USB native (USB-Serial-JTAG) để xem log.
build_flags =
    -DBOARD_HAS_PSRAM
    -DRGB_LED_PIN=48
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
